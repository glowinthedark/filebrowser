name: build-n-release simple

on:
  push:
    branches:
      - "master"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch: 

jobs:
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: "frontend/package.json"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: "frontend/package.json"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run test

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: "latest"

  test:
    name: Test
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - run: go test --race ./...

  build:
    name: Build (${{ matrix.os_name }}-${{ matrix.arch_name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            os_name: macos
            arch_name: arm64
          - goos: darwin
            goarch: amd64
            os_name: macos
            arch_name: amd64
          - goos: windows
            goarch: amd64
            os_name: windows
            arch_name: amd64
          - goos: linux
            goarch: amd64
            os_name: linux
            arch_name: amd64
          - goos: linux
            goarch: arm64
            os_name: linux
            arch_name: aarch64
          - goos: linux
            goarch: arm
            goarm: "7"
            os_name: linux
            arch_name: armhf
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: "frontend/package.json"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"
      - name: Install Task
        uses: go-task/setup-task@v2
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: task build
      - name: Rename Artifact
        shell: bash
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi
          # Account for standard go builds appending `.exe` automatically
          if [ -f "filebrowser${EXT}" ]; then
            mv "filebrowser${EXT}" "filebrowser-${{ matrix.os_name }}-${{ matrix.arch_name }}${EXT}"
          else
            mv "filebrowser" "filebrowser-${{ matrix.os_name }}-${{ matrix.arch_name }}${EXT}"
          fi
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: filebrowser-${{ matrix.os_name }}-${{ matrix.arch_name }}
          path: filebrowser-${{ matrix.os_name }}-${{ matrix.arch_name }}${{ matrix.goos == 'windows' && '.exe' || '' }}
          retention-days: 1

  release:
    name: Release
    needs: ["build"]
    # if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists. Uploading assets..."
            gh release upload "${{ github.ref_name }}" artifacts/* --clobber
          else
            echo "Creating release ${{ github.ref_name }}..."
            gh release create "${{ github.ref_name }}" \
              --title "Release ${{ github.ref_name }}" \
              --generate-notes \
              artifacts/*
          fi
